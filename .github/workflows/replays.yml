name: Replays

on:
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  close:
    name: Close replayed pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Close each pull request a pushed commit replays
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          printf '%s' "$COMMITS" | jq -r '.[] | .id as $id | .message | scan("(?m)^Replays frontic/ui#([0-9]+)$") | "\(.[0]) \($id)"' |
            while read -r pr sha; do
              if [ "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = OPEN ]; then
                gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment "Landed in $sha."
              fi
            done
